<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TTAR tests</title>
  <style>
    body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; max-width: 760px; margin: 48px auto; padding: 0 16px; color: #1d1d1f; background: #fff; }
    h1 { font-size: 28px; letter-spacing: -.02em; }
    li { list-style: none; padding: 6px 0; border-top: 1px solid #eee; }
    .f { color: #d70015; } .p { color: #248a3d; } small { color: #6e6e73; display: block; }
  </style>
</head>
<body>
  <h1 id="h">Running…</h1>
  <ul id="r"></ul>
  <script type="module">
    import { results } from './engine.test.js';
    const fails = results.filter((r) => !r.ok);
    document.title = fails.length ? `FAIL ${fails.length}` : `PASS ${results.length}`;
    document.getElementById('h').textContent = fails.length ? `${fails.length} of ${results.length} failed` : `All ${results.length} passed`;
    document.getElementById('r').innerHTML = results.map((r) =>
      `<li class="${r.ok ? 'p' : 'f'}">${r.ok ? '✓' : '✕'} ${r.name}${r.msg ? `<small>${r.msg.replace(/</g, '&lt;')}</small>` : ''}</li>`).join('');
  </script>
</body>
</html>
